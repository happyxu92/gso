# Experiment identity and repository to analyze.
exp_id: "REPLACE_EXP_ID"
repo_url: "https://github.com/REPLACE_OWNER/REPLACE_REPOSITORY"

# Test count is a generation CLI setting; the skill passes --n 5 by default.
llm:
  model_name: "GLM-5.2"
  base_url: "https://antchat.alipay.com/v1/"
  api_key_env: "LLM_API_KEY"
  multiprocess: 1
  max_tokens: 32768
  openai_timeout: 600
  cache:
    commit_filter: true
    affected_files: true
    api_identification: true
    test_generation: false

api_docs: |
  Focus on public Python APIs exposed by the repository.
  Do not return private helpers or backend-only functions.

py_version: "3.12"
target_commit: "main"
install_commands:
  - "uv venv --python 3.12"
  - "source .venv/bin/activate"
  - "uv pip install -e ."

repo_instr: |
  Generate deterministic CPU-only workloads and keep setup outside the timed region.
  Each test iteration runs under a hard 300s timeout and phase 2 repeats the
  experiment 3 times per commit, so scale inputs so the base/parent commit's
  experiment runs in roughly 1-60 seconds (ideally ~1-30s). The measured
  speedup is a ratio, not an absolute time, so a ~30s base run is enough to
  expose a large speedup; prefer shrinking data volume (fewer rows / categories /
  series / iterations) over dropping realism when a workload is too slow.
